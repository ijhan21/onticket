<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="Pretendard, sans-serif">
  <rect width="840" height="340" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">브랜치와 머지 — 갈라졌다가 다시 합쳐진다</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">main에서 기능 브랜치를 만들어 작업한 뒤, M(머지 커밋)에서 변경 내용을 main에 합친다</text>

  <defs>
    <marker id="m18" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker>
    <marker id="m18o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>

  <!-- feature branch label -->
  <text x="497" y="120" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">feature/payment-polish</text>
  <text x="497" y="203" font-size="11" fill="#5b6472" text-anchor="middle">문구 다듬기 커밋 D, E</text>

  <!-- main line -->
  <line x1="120" y1="250" x2="700" y2="250" stroke="#8a8f98" stroke-width="2.2"/>
  <!-- branch out: C -> D -->
  <path d="M380,250 C 380,180 425,145 490,145" fill="none" stroke="#8a8f98" stroke-width="2.2" marker-end="url(#m18)"/>
  <!-- feature line D -> E -->
  <line x1="490" y1="145" x2="600" y2="145" stroke="#8a8f98" stroke-width="2.2"/>
  <!-- merge in: E -> M (emphasis) -->
  <path d="M600,145 C 665,145 700,180 700,250" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#m18o)"/>

  <!-- main label -->
  <text x="42" y="256" font-size="13" font-weight="700" fill="#0f1419">main</text>

  <!-- commits on main -->
  <g text-anchor="middle">
    <circle cx="120" cy="250" r="21" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.8"/>
    <text x="120" y="256" font-size="15" font-weight="700" fill="#0f1419">A</text>
    <circle cx="250" cy="250" r="21" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.8"/>
    <text x="250" y="256" font-size="15" font-weight="700" fill="#0f1419">B</text>
    <circle cx="380" cy="250" r="21" fill="#fff" stroke="#c8ced6" stroke-width="1.8"/>
    <text x="380" y="256" font-size="15" font-weight="700" fill="#0f1419">C</text>
    <circle cx="700" cy="250" r="23" fill="#fff" stroke="#c2410c" stroke-width="2.4"/>
    <text x="700" y="256" font-size="15" font-weight="700" fill="#c2410c">M</text>
  </g>

  <!-- commits on feature -->
  <g text-anchor="middle">
    <circle cx="490" cy="145" r="21" fill="#fbf7f4" stroke="#e0cabd" stroke-width="1.8"/>
    <text x="490" y="151" font-size="15" font-weight="700" fill="#c2410c">D</text>
    <circle cx="600" cy="145" r="21" fill="#fbf7f4" stroke="#e0cabd" stroke-width="1.8"/>
    <text x="600" y="151" font-size="15" font-weight="700" fill="#c2410c">E</text>
  </g>

  <!-- captions -->
  <text x="380" y="300" font-size="11.5" fill="#5b6472" text-anchor="middle">기능 브랜치 생성</text>
  <text x="700" y="300" font-size="11.5" fill="#c2410c" text-anchor="middle" font-weight="700">변경 내용 병합 (머지 커밋)</text>
</svg>
