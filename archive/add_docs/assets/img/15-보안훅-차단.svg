<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="Pretendard, sans-serif">
  <rect width="840" height="470" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">보안 훅 — 위험한 작업을 실행 직전에 차단한다</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">AI가 .env 읽기를 요청하면 PreToolUse 훅이 먼저 검사해 차단한다</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker>
    <marker id="ah-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>

  <!-- 1. AI 요청 -->
  <rect x="270" y="92" width="300" height="56" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="420" y="116" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">AI가 파일 읽기를 요청한다</text>
  <text x="420" y="136" font-size="12.5" fill="#5b6472" text-anchor="middle">"<tspan font-family="monospace" fill="#0f1419">api/.env</tspan>를 읽겠다"</text>

  <!-- 화살표 1→2 -->
  <line x1="420" y1="148" x2="420" y2="180" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- 2. PreToolUse 훅 (강조) -->
  <rect x="240" y="184" width="360" height="86" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="420" y="210" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">PreToolUse 훅 — 실행 직전 검사</text>
  <text x="420" y="232" font-size="12.5" fill="#5b6472" text-anchor="middle">검사 스크립트 실행</text>
  <text x="420" y="254" font-size="13" font-weight="600" fill="#0f1419" text-anchor="middle">"대상 파일이 <tspan font-family="monospace" fill="#c2410c">.env</tspan>인가?"</text>

  <!-- 갈고리 라벨 -->
  <text x="618" y="215" font-size="11.5" fill="#48515e" font-style="italic">← 이 단계에서</text>
  <text x="618" y="231" font-size="11.5" fill="#48515e" font-style="italic">   실행 전 검사</text>

  <!-- 분기 화살표 -->
  <!-- 왼쪽: 예 -->
  <path d="M330,270 L330,300 L250,300 L250,330" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ah-o)"/>
  <text x="222" y="312" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">예</text>
  <!-- 오른쪽: 아니오 -->
  <path d="M510,270 L510,300 L590,300 L590,330" fill="none" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="622" y="312" font-size="13" font-weight="700" fill="#5b6472" text-anchor="middle">아니오</text>

  <!-- 3-left. 차단 (강조 배경) -->
  <rect x="90" y="334" width="320" height="96" rx="10" fill="#fbf7f4" stroke="#e0cabd" stroke-width="1.5"/>
  <text x="250" y="362" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">차단!</text>
  <text x="250" y="386" font-size="12.5" fill="#5b6472" text-anchor="middle">파일을 읽지 않는다</text>
  <text x="250" y="408" font-size="12.5" fill="#5b6472" text-anchor="middle">AI에게 차단 이유를 알린다</text>

  <!-- 3-right. 통과 -->
  <rect x="430" y="334" width="320" height="96" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="590" y="362" font-size="15" font-weight="700" fill="#0f1419" text-anchor="middle">통과</text>
  <text x="590" y="386" font-size="12.5" fill="#5b6472" text-anchor="middle">보호 대상 파일이 아니므로</text>
  <text x="590" y="408" font-size="12.5" fill="#5b6472" text-anchor="middle">파일 읽기를 실행한다</text>
</svg>
