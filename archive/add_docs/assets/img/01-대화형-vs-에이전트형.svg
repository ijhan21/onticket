<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="Pretendard, sans-serif">
  <rect width="840" height="480" fill="#ffffff"/>

  <!-- ===== 상단: 대화형 ===== -->
  <text x="40" y="42" font-size="19" font-weight="700" fill="#0f1419">대화형 AI — 복사와 붙여넣기의 반복</text>
  <text x="40" y="64" font-size="13" fill="#5b6472">사람이 코드와 오류 메시지를 직접 옮긴다</text>

  <!-- 사람 -->
  <rect x="60" y="96" width="150" height="70" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="135" y="130" font-size="16" font-weight="700" fill="#0f1419" text-anchor="middle">사람</text>
  <text x="135" y="150" font-size="12" fill="#5b6472" text-anchor="middle">질문하고 코드를 옮긴다</text>

  <!-- 챗봇 -->
  <rect x="630" y="96" width="150" height="70" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="705" y="130" font-size="16" font-weight="700" fill="#0f1419" text-anchor="middle">챗봇(웹)</text>
  <text x="705" y="150" font-size="12" fill="#5b6472" text-anchor="middle">답변으로 코드를 제공한다</text>

  <!-- 화살표: 질문 -->
  <line x1="215" y1="118" x2="622" y2="118" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="418" y="110" font-size="12.5" fill="#48515e" text-anchor="middle">"장바구니 코드 짜줘"</text>
  <!-- 화살표: 코드 텍스트 -->
  <line x1="625" y1="146" x2="218" y2="146" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="418" y="163" font-size="12.5" fill="#48515e" text-anchor="middle">답변으로 코드 제공</text>

  <!-- 사람의 수작업 -->
  <g font-size="12" fill="#0f1419">
    <rect x="60" y="188" width="150" height="24" rx="5" fill="#fbf7f4" stroke="#e6d5cc" stroke-width="1"/>
    <text x="135" y="204" text-anchor="middle">복사 → 붙여넣기</text>
    <rect x="60" y="216" width="150" height="24" rx="5" fill="#fbf7f4" stroke="#e6d5cc" stroke-width="1"/>
    <text x="135" y="232" text-anchor="middle">실행 → 오류 메시지 복사</text>
  </g>
  <path d="M 135 240 Q 135 264 300 264 L 700 264 Q 705 264 705 172" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-o)"/>
  <text x="420" y="258" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle">수십 번 반복</text>

  <!-- 구분선 -->
  <line x1="40" y1="300" x2="800" y2="300" stroke="#dfe3e8" stroke-width="1"/>

  <!-- ===== 하단: 에이전트형 ===== -->
  <text x="40" y="336" font-size="19" font-weight="700" fill="#0f1419">에이전트형 AI — 목표를 맡기면 직접 작업</text>
  <text x="40" y="358" font-size="13" fill="#5b6472">목표를 알려 주면 AI가 계획을 세우고 파일 작성·실행·수정을 진행한다</text>

  <!-- 사람 -->
  <rect x="60" y="388" width="130" height="60" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="125" y="414" font-size="15" font-weight="700" fill="#0f1419" text-anchor="middle">사람</text>
  <text x="125" y="433" font-size="11.5" fill="#5b6472" text-anchor="middle">승인 · 검증</text>

  <!-- 목표 화살표 -->
  <line x1="195" y1="405" x2="252" y2="405" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="223" y="396" font-size="11.5" fill="#48515e" text-anchor="middle">목표</text>

  <!-- AI 박스 (내부 루프) -->
  <rect x="258" y="376" width="522" height="86" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="272" y="396" font-size="12.5" font-weight="700" fill="#c2410c">AI 에이전트</text>
  <g font-size="12" fill="#0f1419" text-anchor="middle">
    <rect x="272" y="410" width="86" height="34" rx="6" fill="#f6f7f9"/>
    <text x="315" y="431">계획</text>
    <rect x="374" y="410" width="110" height="34" rx="6" fill="#f6f7f9"/>
    <text x="429" y="431">파일 생성·수정</text>
    <rect x="500" y="410" width="86" height="34" rx="6" fill="#f6f7f9"/>
    <text x="543" y="431">실행</text>
    <rect x="602" y="410" width="110" height="34" rx="6" fill="#f6f7f9"/>
    <text x="657" y="431">오류 수정</text>
  </g>
  <line x1="358" y1="427" x2="371" y2="427" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="484" y1="427" x2="497" y2="427" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="586" y1="427" x2="599" y2="427" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/>
    </marker>
    <marker id="ah-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
