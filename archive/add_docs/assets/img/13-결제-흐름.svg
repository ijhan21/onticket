<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="Pretendard, sans-serif">
  <rect width="840" height="470" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">결제 흐름 — 카드번호는 온티켓 서버를 거치지 않는다</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">카드 정보는 고객과 PG 사이에서 처리한다. 온티켓은 결제 금액을 확인하고 결과를 기록한다</text>

  <!-- 레인 라벨 -->
  <text x="120" y="96" font-size="12" font-weight="700" fill="#5b6472" text-anchor="middle">고객 (브라우저)</text>
  <text x="350" y="96" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">API 서버</text>
  <text x="600" y="96" font-size="12" font-weight="700" fill="#5b6472" text-anchor="middle">토스(PG)</text>
  <line x1="235" y1="104" x2="235" y2="430" stroke="#eef1f4" stroke-width="1"/>
  <line x1="465" y1="104" x2="465" y2="430" stroke="#eef1f4" stroke-width="1"/>

  <!-- 단계 박스들 -->
  <g font-size="11.5">
    <rect x="40" y="116" width="160" height="34" rx="7" fill="#f6f7f9" stroke="#c8ced6"/>
    <text x="120" y="138" fill="#0f1419" text-anchor="middle">1. 예매하기 클릭</text>

    <rect x="270" y="158" width="160" height="34" rx="7" fill="#fff" stroke="#c2410c"/>
    <text x="350" y="180" fill="#0f1419" text-anchor="middle">2. 주문 생성(결제 대기)</text>

    <rect x="40" y="200" width="160" height="34" rx="7" fill="#f6f7f9" stroke="#c8ced6"/>
    <text x="120" y="222" fill="#0f1419" text-anchor="middle">3. 결제하기 → 결제창</text>

    <rect x="520" y="242" width="160" height="34" rx="7" fill="#f6f7f9" stroke="#c8ced6"/>
    <text x="600" y="264" fill="#0f1419" text-anchor="middle">4. 카드 인증(PG에서 처리)</text>

    <rect x="40" y="284" width="160" height="34" rx="7" fill="#f6f7f9" stroke="#c8ced6"/>
    <text x="120" y="306" fill="#0f1419" text-anchor="middle">5. 성공 화면으로 이동</text>

    <rect x="270" y="326" width="200" height="46" rx="7" fill="#fbf7f4" stroke="#c2410c" stroke-width="2"/>
    <text x="370" y="345" fill="#c2410c" font-weight="700" text-anchor="middle">6. 서버 최종 승인 (핵심)</text>
    <text x="370" y="362" fill="#5b6472" text-anchor="middle" font-size="10.5">시크릿 키로 결제 정보·금액 확인</text>

    <rect x="270" y="386" width="200" height="34" rx="7" fill="#fff" stroke="#c2410c"/>
    <text x="370" y="408" fill="#0f1419" text-anchor="middle">7. 확인 완료 → 결제 완료 + QR</text>
  </g>

  <!-- 화살표 -->
  <line x1="200" y1="133" x2="266" y2="168" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#a16)"/>
  <line x1="350" y1="192" x2="200" y2="210" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#a16)"/>
  <line x1="200" y1="217" x2="516" y2="255" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#a16)"/>
  <line x1="520" y1="270" x2="200" y2="298" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#a16)"/>
  <line x1="200" y1="301" x2="360" y2="322" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#a16)"/>
  <line x1="470" y1="349" x2="520" y2="300" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a16o)"/>
  <text x="520" y="330" font-size="10" fill="#c2410c">PG에 확인</text>

  <!-- 경고 박스 -->
  <rect x="500" y="386" width="300" height="66" rx="9" fill="#fff" stroke="#e0cabd" stroke-width="1.2"/>
  <text x="516" y="408" font-size="12" font-weight="700" fill="#c2410c">6번 단계가 중요한 이유</text>
  <text x="516" y="426" font-size="11" fill="#0f1419">5번 성공 화면은 브라우저에서 표시하므로</text>
  <text x="516" y="442" font-size="11" fill="#0f1419">위조 가능. 서버가 PG에 직접 확인해야 한다</text>

  <defs>
    <marker id="a16" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8f98"/></marker>
    <marker id="a16o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>
</svg>
