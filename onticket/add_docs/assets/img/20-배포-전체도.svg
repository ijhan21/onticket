<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" font-family="Pretendard, sans-serif">
  <rect width="840" height="290" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">배포된 온티켓 — 인터넷에서 동작하는 서비스 구조</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">개발 PC를 꺼도 접속할 수 있다. 화면과 API는 각각의 공개 주소로 서비스된다</text>

  <!-- 고객 -->
  <rect x="50" y="130" width="110" height="60" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="105" y="156" font-size="13" font-weight="700" fill="#0f1419" text-anchor="middle">고객</text>
  <text x="105" y="175" font-size="10.5" fill="#5b6472" text-anchor="middle">전 세계 어디서나</text>

  <!-- 프론트 (Vercel) -->
  <rect x="230" y="120" width="180" height="80" rx="11" fill="#fff" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="320" y="146" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">web (화면)</text>
  <text x="320" y="165" font-size="11" fill="#5b6472" text-anchor="middle">Vercel</text>
  <text x="320" y="184" font-size="10.5" fill="#c2410c" text-anchor="middle" font-family="monospace">onticket.vercel.app</text>

  <!-- API (Workers) -->
  <rect x="480" y="120" width="180" height="80" rx="11" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="570" y="146" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">api (검증·계산)</text>
  <text x="570" y="165" font-size="11" fill="#5b6472" text-anchor="middle">Cloudflare Workers</text>
  <text x="570" y="184" font-size="10.5" fill="#c2410c" text-anchor="middle" font-family="monospace">...workers.dev</text>

  <!-- DB (Supabase) -->
  <rect x="710" y="120" width="110" height="80" rx="11" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="765" y="150" font-size="13" font-weight="700" fill="#0f1419" text-anchor="middle">DB</text>
  <text x="765" y="169" font-size="10.5" fill="#5b6472" text-anchor="middle">Supabase</text>

  <!-- 연결 -->
  <line x1="160" y1="160" x2="226" y2="160" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#a22)"/>
  <line x1="410" y1="160" x2="476" y2="160" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#a22)"/>
  <text x="443" y="152" font-size="10" fill="#48515e" text-anchor="middle">fetch</text>
  <line x1="660" y1="160" x2="706" y2="160" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#a22)"/>

  <!-- CORS 메모 -->
  <text x="443" y="240" font-size="11" fill="#c2410c" text-anchor="middle">API의 CORS 설정에서 프론트엔드 주소를 허용해야 연결된다</text>
  <line x1="320" y1="200" x2="320" y2="226" stroke="#e0cabd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="570" y1="200" x2="570" y2="226" stroke="#e0cabd" stroke-width="1" stroke-dasharray="3 3"/>

  <defs>
    <marker id="a22" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker>
  </defs>
</svg>
