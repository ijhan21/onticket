<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" font-family="Pretendard, sans-serif">
  <rect width="840" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">하나의 API 서버에 여러 클라이언트가 연결된다</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">웹·앱·타사 시스템이 같은 API를 사용한다. 검증과 업무 규칙은 서버에서 처리한다</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker>
    <marker id="ah-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>

  <!-- 클라이언트 4개 -->
  <rect x="40" y="100" width="170" height="62" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="125" y="128" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">웹 화면</text>
  <text x="125" y="147" font-size="11.5" fill="#5b6472" text-anchor="middle">web/</text>

  <rect x="240" y="100" width="170" height="62" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="325" y="128" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">아이폰 앱</text>
  <text x="325" y="147" font-size="11.5" fill="#5b6472" text-anchor="middle">iOS</text>

  <rect x="440" y="100" width="170" height="62" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="525" y="128" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">안드로이드 앱</text>
  <text x="525" y="147" font-size="11.5" fill="#5b6472" text-anchor="middle">Android</text>

  <rect x="640" y="100" width="170" height="62" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="725" y="128" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">타사 입점 시스템</text>
  <text x="725" y="147" font-size="11.5" fill="#5b6472" text-anchor="middle">외부 파트너</text>

  <!-- 각 클라이언트에서 버스로 내려오는 선 -->
  <line x1="125" y1="162" x2="125" y2="196" stroke="#8a8f98" stroke-width="1.8"/>
  <line x1="325" y1="162" x2="325" y2="196" stroke="#8a8f98" stroke-width="1.8"/>
  <line x1="525" y1="162" x2="525" y2="196" stroke="#8a8f98" stroke-width="1.8"/>
  <line x1="725" y1="162" x2="725" y2="196" stroke="#8a8f98" stroke-width="1.8"/>
  <!-- 수평 버스 -->
  <line x1="125" y1="196" x2="725" y2="196" stroke="#8a8f98" stroke-width="1.8"/>

  <!-- 버스 -> API 서버 -->
  <line x1="420" y1="196" x2="420" y2="250" stroke="#c2410c" stroke-width="2" marker-end="url(#ah-o)"/>
  <text x="432" y="228" font-size="12" fill="#c2410c" font-weight="700">모두 같은 API로 요청</text>

  <!-- API 서버 (강조) -->
  <rect x="270" y="254" width="300" height="78" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="420" y="286" font-size="16" font-weight="700" fill="#c2410c" text-anchor="middle">API 서버 (api/)</text>
  <text x="420" y="310" font-size="12.5" fill="#5b6472" text-anchor="middle">검증·업무 규칙을 한곳에서 처리</text>

  <!-- API -> DB -->
  <line x1="420" y1="332" x2="420" y2="386" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="432" y="364" font-size="12" fill="#48515e">조회·저장</text>

  <!-- DB -->
  <rect x="290" y="390" width="260" height="70" rx="12" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="420" y="422" font-size="15" font-weight="700" fill="#0f1419" text-anchor="middle">데이터베이스</text>
  <text x="420" y="444" font-size="12" fill="#5b6472" text-anchor="middle">데이터를 한곳에서 관리</text>
</svg>
