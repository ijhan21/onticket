<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8f98"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f1419">고객이 밟는 길 — 앞으로 가는 길과 되돌아가는 길</text>
  <text x="24" y="56" font-size="12.5" fill="#5b6472">위 화살표는 다음 화면으로, 아래 화살표는 이전 화면으로 돌아가는 길이다</text>

  <!-- 화면 다섯 개 -->
  <g font-size="14.5" font-weight="700" fill="#0f1419" text-anchor="middle">
    <rect x="24"  y="94" width="116" height="52" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
    <text x="82"  y="125">이벤트 목록</text>
    <rect x="220" y="94" width="116" height="52" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
    <text x="278" y="125">이벤트 상세</text>
    <rect x="416" y="94" width="116" height="52" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
    <text x="474" y="125">예매</text>
    <rect x="612" y="94" width="116" height="52" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
    <text x="670" y="125">결제</text>
    <rect x="808" y="94" width="116" height="52" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="866" y="125" fill="#c2410c">완료</text>
  </g>

  <!-- 앞으로 가는 길 -->
  <g stroke="#8a8f98" stroke-width="1.8" fill="none">
    <line x1="142" y1="120" x2="215" y2="120" marker-end="url(#g)"/>
    <line x1="338" y1="120" x2="411" y2="120" marker-end="url(#g)"/>
    <line x1="534" y1="120" x2="607" y2="120" marker-end="url(#g)"/>
    <line x1="730" y1="120" x2="803" y2="120" marker-end="url(#g)"/>
  </g>
  <g font-size="12" fill="#48515e" text-anchor="middle">
    <text x="180" y="110">카드 선택</text>
    <text x="376" y="110">예매하기</text>
    <text x="572" y="110">결제하기</text>
    <text x="768" y="110">결제 성공</text>
  </g>

  <!-- 되돌아가는 길 -->
  <g stroke-width="1.8" fill="none">
    <path d="M236,148 V196 H82 V153" stroke="#8a8f98" marker-end="url(#g)"/>
    <path d="M432,148 V196 H316 V153" stroke="#8a8f98" marker-end="url(#g)"/>
    <path d="M628,148 V196 H512 V153" stroke="#c2410c" marker-end="url(#o)"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="136" y="186" width="46" height="20" fill="#ffffff"/>
    <text x="159" y="200" fill="#48515e">뒤로</text>
    <rect x="351" y="186" width="46" height="20" fill="#ffffff"/>
    <text x="374" y="200" fill="#48515e">뒤로</text>
    <rect x="518" y="186" width="104" height="20" fill="#ffffff"/>
    <text x="570" y="200" fill="#c2410c" font-weight="600">취소·결제 실패</text>
  </g>

  <!-- 구분선 -->
  <line x1="24" y1="246" x2="936" y2="246" stroke="#eef1f4" stroke-width="2"/>
  <text x="24" y="276" font-size="13.5" font-weight="700" fill="#0f1419">고객 흐름 밖의 화면</text>

  <!-- 마이티켓 -->
  <rect x="24" y="298" width="128" height="52" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="88" y="329" font-size="14.5" font-weight="700" fill="#0f1419" text-anchor="middle">마이티켓</text>
  <line x1="154" y1="324" x2="331" y2="324" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#g)"/>
  <text x="243" y="314" font-size="12" fill="#48515e" text-anchor="middle">주문번호 + 이메일 입력</text>
  <rect x="336" y="298" width="116" height="52" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="394" y="329" font-size="14.5" font-weight="700" fill="#0f1419" text-anchor="middle">티켓 표시</text>
  <path d="M70,352 V384 H112 V357" stroke="#c2410c" stroke-width="1.8" fill="none" marker-end="url(#o)"/>
  <text x="124" y="378" font-size="12" fill="#c2410c" font-weight="600">일치하는 주문이 없으면 안내문</text>
  <text x="124" y="396" font-size="12" fill="#5b6472">같은 화면에 머문다</text>

  <!-- 운영자 판매 현황 -->
  <rect x="620" y="298" width="176" height="52" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="708" y="329" font-size="14.5" font-weight="700" fill="#0f1419" text-anchor="middle">운영자 판매 현황</text>
  <text x="708" y="376" font-size="12" fill="#5b6472" text-anchor="middle">고객의 흐름과 이어지지 않는 별도 화면</text>
</svg>
