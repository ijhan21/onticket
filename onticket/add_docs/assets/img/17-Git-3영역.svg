<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="Pretendard, sans-serif">
  <rect width="840" height="340" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">Git의 세 영역 — 수정한 파일을 커밋하는 과정</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">작업 폴더에서 파일을 수정하고, add로 변경을 선택한 뒤 commit으로 이력을 남긴다</text>

  <defs>
    <marker id="ah-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>

  <!-- 영역 1: 작업 폴더 -->
  <rect x="40" y="118" width="230" height="100" rx="12" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="155" y="150" font-size="15" font-weight="700" fill="#0f1419" text-anchor="middle">작업 폴더</text>
  <text x="155" y="174" font-size="12.5" fill="#5b6472" text-anchor="middle">파일을 수정하는 곳</text>
  <text x="155" y="196" font-size="12" fill="#48515e" text-anchor="middle">아직 커밋하지 않은 변경</text>

  <!-- 영역 2: 스테이징 영역 -->
  <rect x="305" y="118" width="230" height="100" rx="12" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="420" y="150" font-size="15" font-weight="700" fill="#0f1419" text-anchor="middle">스테이징 영역</text>
  <text x="420" y="174" font-size="12.5" fill="#5b6472" text-anchor="middle">이번 커밋에 넣을 변경 선택</text>
  <text x="420" y="196" font-size="12" fill="#48515e" text-anchor="middle">커밋 준비</text>

  <!-- 영역 3: 커밋 이력 (강조) -->
  <rect x="570" y="118" width="230" height="100" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="685" y="150" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">커밋 이력 (저장소)</text>
  <text x="685" y="174" font-size="12.5" fill="#5b6472" text-anchor="middle">변경 내용이 커밋으로 저장됨</text>
  <text x="685" y="196" font-size="12" fill="#48515e" text-anchor="middle">영구 기록</text>

  <!-- 화살표 1→2: git add -->
  <line x1="270" y1="168" x2="301" y2="168" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ah-o)"/>

  <!-- 화살표 2→3: git commit -->
  <line x1="535" y1="168" x2="566" y2="168" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ah-o)"/>

  <!-- 명령 라벨 박스 (add) -->
  <rect x="228" y="246" width="114" height="44" rx="9" fill="#fbf7f4" stroke="#e0cabd" stroke-width="1.2"/>
  <text x="285" y="266" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle" font-family="monospace">git add</text>
  <text x="285" y="283" font-size="11" fill="#5b6472" text-anchor="middle">커밋할 변경 선택</text>
  <line x1="285" y1="218" x2="285" y2="244" stroke="#e0cabd" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- 명령 라벨 박스 (commit) -->
  <rect x="493" y="246" width="130" height="44" rx="9" fill="#fbf7f4" stroke="#e0cabd" stroke-width="1.2"/>
  <text x="558" y="266" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle" font-family="monospace">git commit</text>
  <text x="558" y="283" font-size="11" fill="#5b6472" text-anchor="middle">변경 이력 저장</text>
  <line x1="558" y1="218" x2="558" y2="244" stroke="#e0cabd" stroke-width="1.4" stroke-dasharray="4 3"/>
</svg>
