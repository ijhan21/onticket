<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" font-family="Pretendard, sans-serif">
  <rect width="920" height="740" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">예매 요청이 처리되는 과정</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">화면 → API 서버 → DB 순서로 요청을 처리하고 결과를 돌려준다. 검증·계산은 API 서버가 담당한다</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker>
    <marker id="ah-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>

  <!-- lane headers -->
  <rect x="40" y="88" width="150" height="54" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="115" y="112" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">고객</text>
  <text x="115" y="131" font-size="11" fill="#5b6472" text-anchor="middle">브라우저</text>

  <rect x="255" y="88" width="170" height="54" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="340" y="112" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">프론트엔드</text>
  <text x="340" y="131" font-size="11" fill="#5b6472" text-anchor="middle">화면만 담당</text>

  <rect x="490" y="88" width="180" height="54" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="580" y="112" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">API 서버</text>
  <text x="580" y="131" font-size="11" fill="#5b6472" text-anchor="middle">검증·계산 담당</text>

  <rect x="735" y="88" width="150" height="54" rx="10" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.5"/>
  <text x="810" y="112" font-size="14" font-weight="700" fill="#0f1419" text-anchor="middle">데이터베이스</text>
  <text x="810" y="131" font-size="11" fill="#5b6472" text-anchor="middle">데이터 저장</text>

  <!-- lifelines -->
  <line x1="115" y1="142" x2="115" y2="690" stroke="#dfe3e8" stroke-width="1.5"/>
  <line x1="340" y1="142" x2="340" y2="690" stroke="#dfe3e8" stroke-width="1.5"/>
  <line x1="580" y1="142" x2="580" y2="690" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="810" y1="142" x2="810" y2="690" stroke="#dfe3e8" stroke-width="1.5"/>

  <!-- step 1: 고객 클릭 -> 프론트 -->
  <text x="118" y="176" font-size="11.5" fill="#c2410c" font-weight="700">① 예매 버튼 클릭</text>
  <line x1="115" y1="184" x2="337" y2="184" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- step 2: 프론트 -> API 요청 -->
  <text x="344" y="216" font-size="11.5" fill="#48515e">② “42번 행사, 1일권 2장 주문”</text>
  <line x1="340" y1="224" x2="577" y2="224" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ah-o)"/>
  <text x="450" y="240" font-size="10.5" fill="#c2410c" text-anchor="middle">요청</text>

  <!-- step 3: API -> DB 잔여 확인 -->
  <text x="584" y="272" font-size="11.5" fill="#48515e">③ “42번 행사 1일권 잔여 수량 조회”</text>
  <line x1="580" y1="280" x2="807" y2="280" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- step 4: DB -> API 응답 -->
  <text x="807" y="312" font-size="11.5" fill="#48515e" text-anchor="end">④ “잔여 수량: 2장”</text>
  <line x1="810" y1="320" x2="583" y2="320" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- API note: 판정 / 계산 -->
  <rect x="452" y="344" width="256" height="70" rx="10" fill="#fbf7f4" stroke="#e0cabd" stroke-width="1.5"/>
  <text x="580" y="367" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="middle">API 서버가 재고 검증·금액 계산</text>
  <text x="580" y="388" font-size="12" fill="#0f1419" text-anchor="middle">재고: 잔여 2 ≥ 주문 2 → 주문 가능</text>
  <text x="580" y="406" font-size="12" fill="#0f1419" text-anchor="middle">계산: 99,000 × 2 = 198,000</text>

  <!-- step 5: API -> DB 저장 -->
  <text x="584" y="446" font-size="11.5" fill="#48515e">⑤ “주문 저장, 잔여 수량 2 → 0”</text>
  <line x1="580" y1="454" x2="807" y2="454" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- step 6: DB -> API 저장 완료 -->
  <text x="807" y="486" font-size="11.5" fill="#48515e" text-anchor="end">⑥ “저장 완료(주문번호 발급)”</text>
  <line x1="810" y1="494" x2="583" y2="494" stroke="#8a8f98" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- step 7: API -> 프론트 예매 완료 -->
  <text x="337" y="534" font-size="11.5" fill="#c2410c" font-weight="700" text-anchor="end">⑦ “주문 접수(결제대기), 주문번호 + 금액”</text>
  <line x1="580" y1="542" x2="343" y2="542" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ah-o)"/>

  <!-- step 8: 프론트 -> 고객 화면 -->
  <text x="118" y="582" font-size="11.5" fill="#c2410c" font-weight="700">⑧ 화면에 표시</text>
  <line x1="340" y1="590" x2="118" y2="590" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ah-o)"/>

  <!-- 고객 화면 결과 박스 -->
  <rect x="40" y="616" width="220" height="58" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="150" y="640" font-size="13.5" font-weight="700" fill="#c2410c" text-anchor="middle">고객 화면: 결제 화면</text>
  <text x="150" y="660" font-size="12" fill="#5b6472" text-anchor="middle">주문번호 + 금액</text>
</svg>
