<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="Pretendard, sans-serif">
  <rect width="840" height="320" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0f1419">revert — 이전 이력을 유지하며 변경을 취소하는 새 커밋을 만든다</text>
  <text x="40" y="62" font-size="13" fill="#5b6472">E'는 E를 삭제하지 않고, E의 변경 내용을 취소하는 새 커밋이다</text>

  <defs>
    <marker id="r18" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker>
    <marker id="r18o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>

  <!-- history line -->
  <line x1="110" y1="175" x2="200" y2="175" stroke="#8a8f98" stroke-width="2.2"/>
  <line x1="242" y1="175" x2="378" y2="175" stroke="#8a8f98" stroke-width="2.2"/>
  <line x1="422" y1="175" x2="558" y2="175" stroke="#8a8f98" stroke-width="2.2"/>

  <!-- ...prior history -->
  <text x="80" y="181" font-size="15" font-weight="700" fill="#5b6472" text-anchor="middle">…</text>

  <!-- commit D -->
  <circle cx="222" cy="175" r="21" fill="#f6f7f9" stroke="#c8ced6" stroke-width="1.8"/>
  <text x="222" y="181" font-size="15" font-weight="700" fill="#0f1419" text-anchor="middle">D</text>

  <!-- commit E -->
  <circle cx="400" cy="175" r="21" fill="#fff" stroke="#c8ced6" stroke-width="1.8"/>
  <text x="400" y="181" font-size="15" font-weight="700" fill="#0f1419" text-anchor="middle">E</text>
  <text x="400" y="228" font-size="11.5" fill="#5b6472" text-anchor="middle">변경을 적용한 커밋</text>

  <!-- commit E' (revert) -->
  <circle cx="580" cy="175" r="23" fill="#fff" stroke="#c2410c" stroke-width="2.4"/>
  <text x="580" y="181" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">E'</text>
  <text x="580" y="228" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">E의 변경을 취소한 커밋</text>

  <!-- "cancels" arc from E' back to E -->
  <path d="M566,157 C 545,120 435,120 414,157" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#r18o)"/>
  <text x="490" y="118" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">E의 변경 내용을 취소</text>

  <!-- bottom note -->
  <rect x="150" y="256" width="540" height="44" rx="10" fill="#fbf7f4" stroke="#e0cabd" stroke-width="1.2"/>
  <text x="420" y="283" font-size="12.5" fill="#0f1419" text-anchor="middle">D와 E는 그대로 남는다. 변경을 취소한 과정도 새 커밋으로 기록된다</text>
</svg>
